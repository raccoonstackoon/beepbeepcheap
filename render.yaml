services:
  - type: web
    name: beepbeep-api
    runtime: docker
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://beepbeep-api.onrender.com
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: ANTHROPIC_API_KEY
        sync: false
