services:
  - type: web
    name: beepbeep-api
    runtime: node
    buildCommand: npm install && cd backend && npx puppeteer browsers install chrome && cd .. && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Browser origin (CORS + cookies). Must match where users open the app (not the API URL).
      - key: FRONTEND_URL
        value: https://beepbeep.cheap
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
