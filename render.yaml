services:
  - type: web
    name: beepbeep-api
    runtime: node
    buildCommand: npm install && cd backend && npx puppeteer browsers install chrome && cd .. && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://beepbeep-api.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
